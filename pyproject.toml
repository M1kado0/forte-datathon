[project]
name = "forte-datathon"
version = "0.1.0"
description = "DATATHON '26 — ForteBank case"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "shap>=0.46",
  "pandera>=0.20",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "jupytext>=1.16",
  "nbstripout>=0.7",
  "ipykernel>=6.29",
]
eda = [
  "skrub>=0.3",
]

[tool.uv]
default-groups = ["dev", "eda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
