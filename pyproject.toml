[project]
name = "forte-datathon"
version = "0.1.0"
description = "DATATHON '26 — ForteBank case"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "shap>=0.46",
  "pandera>=0.20",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "torch>=2.12",
  "torchvision>=0.27",
  "transformers>=5.0",
  "huggingface-hub>=1.0",
  "opencv-python-headless>=4.10",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "protobuf>=5",
  "pyyaml>=6.0.3",
  "python-multipart>=0.0.32",
  "pillow>=12.3.0",
  "scipy>=1.17.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "jupytext>=1.16",
  "nbstripout>=0.7",
  "ipykernel>=6.29",
]
eda = [
  "skrub>=0.3",
]

[tool.uv]
default-groups = ["dev", "eda"]

# CUDA 13.2 build on Linux/Windows (RTX 50xx needs it); macOS keeps the CPU/MPS build from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
