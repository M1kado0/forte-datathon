# Violation type -> norm. P4 owns the content, T09 code reads it.
# Every title, number and quote is copied from the Russian text on adilet.zan.kz (checked 18.10.2026).
# Quotes: docs/research/nbrk-rules-v2.md, section "Проверка 17.10.2026, 23:50". Types: docs/adr/0005-scenario-taxonomy.md.
#
# Citation shown to the user = "<title>, утв. <approved_by>, <punkt>". Never the пункт alone:
# one adilet page holds the resolution, the Rules and a list of repealed acts, each with its own numbering.
# A rule without punkt cites the act as a whole; whole_act says why no пункт fits.
#
# name is the scenario from the video (ADR 0005), videos are the labelled videos that show it.
# norm is the closeness from the ADR 0005 table: точная, ближайшая (same subject, not a direct ban), акт целиком.
# description holds only facts a heuristic observed (TZ-7.1, criterion 4). Allowed placeholder: {object}.
# With a ближайшая norm the description names one visible fact and never claims the norm is broken.
# conditions are what the heuristic must check before it may use this type.

documents:
  pravila_231:
    short: Правила № 231
    title: >-
      Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей
      в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты
      и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
    approved_by: постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231
    registration: Зарегистрировано в Министерстве юстиции Республики Казахстан 3 декабря 2019 года № 19680
    url: https://adilet.zan.kz/rus/docs/V1900019680
    status: действующий, дата последнего изменения 12.07.2026 (карточка adilet, 17.10.2026)
    secondary: false

  pravila_14:
    short: Правила № 14
    title: >-
      Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов
      Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых
      является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно
      через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции
      с наличной иностранной валютой
    approved_by: постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14
    registration: Зарегистрировано в Министерстве юстиции Республики Казахстан 27 февраля 2020 года № 20075
    url: https://adilet.zan.kz/rus/docs/V2000020075
    status: действующий, дата последнего изменения 24.12.2024 (карточка adilet, 17.10.2026)
    secondary: false

  instrukciya_21:
    short: Инструкция № 21
    title: >-
      Инструкция по организации антитеррористической защиты расчетно-кассовых отделений банков второго уровня,
      уязвимых в террористическом отношении
    approved_by: >-
      постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка
      от 30 апреля 2024 года № 21
    registration: Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2024 года № 34348
    url: https://adilet.zan.kz/rus/docs/V2400034348
    status: действующий, одна редакция (карточка adilet, 17.10.2026)
    # Issued by АРРФР, not НБРК, and covers only РКО designated as terrorism-vulnerable. Cite next to a primary act.
    secondary: true

  trebovaniya_53:
    short: Требования АРРФР № 53
    title: >-
      Требования к обеспечению информационной безопасности банков, филиалов банков-нерезидентов
      Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций
    approved_by: >-
      постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка
      от 3 апреля 2026 года № 53
    registration: Зарегистрировано в Министерстве юстиции Республики Казахстан 6 апреля 2026 года № 38336
    url: https://adilet.zan.kz/rus/docs/V2600038336
    status: действующий (вкладка «Информация» adilet, 17.10.2026)
    # Issued by АРРФР for every bank, the only act in force on bank laptops, so it stands alone.
    secondary: false

types:
  - id: keys_left_on_safe
    name: Ключи оставлены на сейфе
    videos: [X-11, X-22]
    norm: точная
    rules:
      - doc: pravila_231
        punkt: п. 80
        quote: >-
          Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков
          кладовой и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств,
          находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег
          (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка,
          обеспечивающими исключение их несанкционированного использования.
    conditions:
      - П. 80 отсылает к внутреннему документу банка, его в кадре не видно. Пишем, где лежит ключ, а не какой
        порядок нарушен.
    description: >-
      Ключ оставлен на сейфе.

  - id: safe_left_open
    name: Сейф оставлен открытым
    videos: [X-20]
    norm: ближайшая
    rules:
      - doc: pravila_231
        punkt: п. 20, часть вторая
        quote: >-
          Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте
          кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег
          (металлический шкаф, сейф, тележка, ящики стола, тумба).
    conditions:
      - Пункта о состоянии сейфа нет, п. 20 называет сейф устройством, закрывающимся на ключ. Описание
        называет только открытую дверцу.
    description: >-
      Дверца сейфа открыта.

  - id: cash_left_on_desk
    name: Наличные оставлены на столе вместо сейфа
    videos: [X-26]
    norm: точная
    rules:
      - doc: pravila_231
        punkt: п. 20, часть вторая
        quote: >-
          На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги
          хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ,
          предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).
    conditions:
      - Деньги текущего клиента на столе п. 20 разрешает, поэтому клиента, которого обслуживают, у кассы нет.
      - Кассира у рабочего места нет, а наличные лежат на столе.
    description: >-
      Наличные лежат на столе вне закрывающегося устройства, кассир у рабочего места не виден.

  - id: valuables_left_on_desk
    name: Важные предметы оставлены на столе вместо сейфа
    videos: [X-24]
    norm: ближайшая
    rules:
      - doc: pravila_231
        punkt: п. 80
        quote: >-
          Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков
          кладовой и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств,
          находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег
          (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка,
          обеспечивающими исключение их несанкционированного использования.
    conditions:
      - Ценности определяет п. 2 подп. 17), по видео не узнать, что лежит на столе. Описание называет предмет
        классом детектора и не называет его ценностью.
    description: >-
      На столе вне сейфа лежит предмет: {object}.

  - id: cash_on_desk_next_client
    name: Наличные на столе при обслуживании следующего клиента
    videos: [X-38, X-4]
    norm: точная
    rules:
      - doc: pravila_231
        punkt: п. 20, часть вторая
        quote: >-
          На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги
          хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ,
          предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).
    conditions:
      - На столе могут лежать только деньги клиента, которого обслуживают сейчас. Тип срабатывает, когда наличные
        предыдущего клиента остаются на столе после смены клиента.
    description: >-
      Наличные предыдущего клиента остались на столе вне закрытого устройства, пока кассир обслуживает следующего
      клиента.

  - id: outsider_in_cash_room
    name: Посторонний в кассовом помещении
    videos: [X-18, X-30]
    norm: точная
    rules:
      - doc: pravila_14
        punkt: п. 8
        quote: >-
          Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений
          одним закрывающимся служебным входом.
      - doc: instrukciya_21
        punkt: п. 14 подп. 1)
        quote: >-
          Пропускной режим предназначен для того, чтобы исключить: 1) проникновение в расчетно-кассовое отделение
          или его части (зоны) посторонних лиц с противоправными намерениями;
    conditions:
      - Человек находится в кассовом узле, а не в клиентской зоне перед кассой.
    description: >-
      В кассовом узле находится человек, который не работает за кассой, без сопровождения работника кассы.

  - id: foreign_object_at_desk
    name: Посторонний предмет на столе кассира
    videos: [X-15, X-40, X-46]
    norm: ближайшая
    rules:
      - doc: pravila_231
        punkt: п. 12
        quote: >-
          Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла
          в порядке, установленном внутренними документами банка.
    conditions:
      - П. 12 касается только личных вещей работников. Чей предмет, по видео не узнать, поэтому описание
        называет только предмет.
      - П. 12 разрешает средства связи без функции фото и видео. Камеру в телефоне по видео не проверить,
        поэтому ее наличие не утверждаем.
    description: >-
      На столе кассира виден посторонний предмет: {object}.

  - id: cash_room_door_open
    name: Дверь кассового помещения оставлена открытой
    videos: [X-32, X-33]
    norm: ближайшая
    rules:
      - doc: pravila_14
        punkt: п. 8
        quote: >-
          Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений
          одним закрывающимся служебным входом.
    conditions:
      - Пункта о состоянии двери нет, п. 8 требует закрывающийся служебный вход. Описание называет только
        открытую дверь.
    description: >-
      Дверь кассового помещения открыта.

  - id: laptop_left_open
    name: Ноутбук оставлен открытым
    videos: [X-28]
    norm: акт целиком
    rules:
      - doc: trebovaniya_53
        whole_act: >-
          П. 71 подп. 9) требует блокировки после 30 минут неактивности, а видео длится 16.5 с, поэтому пункт
          не цитируем.
    conditions:
      - Ноутбук открыт, работника у ноутбука нет. Время бездействия по видео не измерить.
    description: >-
      Ноутбук на рабочем месте открыт, работник у ноутбука не виден в кадре.

  - id: cash_put_away_uncounted
    name: Наличные убраны без пересчёта
    videos: [X-13]
    norm: ближайшая
    rules:
      - doc: pravila_231
        punkt: п. 20, часть первая
        quote: Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.
      - doc: pravila_231
        punkt: п. 19 подп. 2)
        quote: >-
          2) принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность
          и платежность наличных денег в соответствии с пунктами 57 и 58 Правил;
    conditions:
      - Пункты описывают прием от клиента, а в X-13 деньги взяты из ящика. Описание называет только то, что
        пересчета в кадре не видно.
    description: >-
      Пересчет банкнот перед тем, как наличные убраны, в кадре не виден.

  - id: detector_not_used
    name: Банкноты не проверены на детекторе подлинности
    videos: [X-44]
    norm: точная
    rules:
      - doc: pravila_231
        punkt: п. 19 подп. 2)
        quote: >-
          2) принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность
          и платежность наличных денег в соответствии с пунктами 57 и 58 Правил;
      - doc: pravila_231
        punkt: п. 9
        quote: >-
          Банк обеспечивает наличие специальных оборудований для определения платежности и подлинности банкнот
          при осуществлении кассовых операций.
    conditions:
      - П. 19 подп. 2) требует проверки подлинности, метод в тексте не назван, а детектор может стоять вне кадра.
    description: >-
      Кассир принимает банкноты, проверка банкнот на детекторе в кадре не видна.

  - id: client_left_during_count
    name: Клиент ушёл во время пересчёта
    videos: [X-34]
    norm: точная
    rules:
      - doc: pravila_231
        punkt: п. 20, часть первая
        quote: Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.
    conditions:
      - Кассир пересчитывает наличные, клиент уходит от кассы до конца пересчета.
    description: >-
      Клиент ушел от кассы, пока кассир пересчитывает его наличные.

  - id: collector_id_not_shown
    name: Инкассатор не показал удостоверение
    videos: [X-17]
    norm: ближайшая
    rules:
      - doc: pravila_231
        punkt: п. 101 подп. 1)
        quote: >-
          1) инкассатору-сборщику: ... служебное удостоверение работника подразделения инкассации банка,
          инкассаторской организации;
    conditions:
      - Доверенность по приложению 4 требует предъявить удостоверение при получении сумки от клиента, а в X-17
        инкассатор сумку сдает. Описание называет только то, что удостоверения в кадре не видно.
      - Приложение 4 допускает данные сервиса цифровых документов, их по видео не проверить.
    description: >-
      Удостоверение инкассатора в кадре не видно.

  - id: id_not_presented
    name: Выдача наличных без документа, удостоверяющего личность
    videos: [X-2]
    norm: точная
    rules:
      - doc: pravila_231
        punkt: п. 31 подп. 1)
        quote: >-
          Кассовый работник банка осуществляет следующие действия: 1) проводит визуальную идентификацию клиента
          по данным документа, удостоверяющего личность, либо данным, подтверждающим (идентифицирующим) личность
          клиента, полученным посредством сервиса цифровых документов;
    conditions:
      - П. 31 описывает выдачу наличных денег клиенту, поэтому тип требует клиента у кассы и наличные на столе.
      - Подп. 1) допускает идентификацию через сервис цифровых документов, по видео ее не проверить. Пишем
        "документ в кадре не виден", а не "идентификация не проведена".
      - Документ небольшой и может быть закрыт руками или стойкой, поэтому признак косвенный.
    description: >-
      Кассир выдает наличные клиенту, документ, удостоверяющий личность, в кадре не виден.

  - id: cash_partially_given
    name: Наличные выданы клиенту не полностью
    videos: [X-1]
    norm: акт целиком
    rules:
      - doc: pravila_231
        whole_act: >-
          Точного пункта нет. Ближе всего п. 31 подп. 3), 4): кассир подготавливает сумму, подлежащую выдаче,
          и выдает клиенту наличные деньги, но слова "полностью" в пункте нет (тикет #69).
    conditions:
      - Часть наличных остается на столе кассира после того, как клиент их получил.
    description: >-
      Часть наличных осталась на столе кассира после выдачи клиенту.

  # The two types below have no labelled video under ADR 0005. They stay until the heuristics ticket moves
  # their heuristics to the new types: src/heuristics/detect.py and its tests reference these ids.
  - id: workplace_left
    name: Рабочее место оставлено с незакрытыми ценностями
    norm: точная
    rules:
      - doc: pravila_231
        punkt: п. 22
        quote: Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.
      - doc: pravila_231
        punkt: п. 20, часть вторая
        quote: >-
          Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте
          кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег
          (металлический шкаф, сейф, тележка, ящики стола, тумба).
    conditions:
      - П. 22 действует только до окончания обслуживания клиента, поэтому клиент виден у кассы, когда кассир уходит.
    description: >-
      Кассир покинул рабочее место до окончания обслуживания клиента, наличные остались на столе вне закрытого
      устройства.

  - id: count_without_controller
    name: Пересчёт наличных без контролирующего работника
    norm: точная
    rules:
      - doc: pravila_231
        punkt: п. 42
        quote: >-
          Кассовые операции по пересчету, сортировке и упаковке наличных денег осуществляются кассовым работником
          в присутствии контролирующего работника, за исключением случаев совершения кассовых операций по приему
          и выдаче наличных денег клиенту.
    conditions:
      - П. 42 не применяется к приему и выдаче наличных клиенту, поэтому клиента у кассы нет.
      - Контролер может быть вне кадра, поэтому пишем "не виден в кадре", а не "отсутствует".
    description: >-
      Кассир пересчитывает наличные без клиента у кассы, контролирующий работник не виден в кадре.

  - id: other
    name: Иное подозрительное действие
    fallback: true
