# Violation type -> norm. P4 owns the content, T09 code reads it.
# Every title, number and quote is copied from the Russian text on adilet.zan.kz (checked 17.10.2026).
# Check log and the full list of пункты: docs/research/nbrk-rules.md. Decisions: docs/adr/0003-violation-taxonomy.md.
#
# Citation shown to the user = "<title>, утв. <approved_by>, <punkt>". Never the пункт alone:
# one adilet page holds the resolution, the Rules and a list of repealed acts, each with its own numbering.
#
# description holds only facts a heuristic observed (TZ-7.1, criterion 4). Allowed placeholder: {object}.
# conditions are what the heuristic must check before it may use this type.

documents:
  pravila_231:
    title: >-
      Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей
      в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты
      и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
    approved_by: постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231
    registration: Зарегистрировано в Министерстве юстиции Республики Казахстан 3 декабря 2019 года № 19680
    url: https://adilet.zan.kz/rus/docs/V1900019680
    status: действующий, дата последнего изменения 12.07.2026 (карточка adilet, 17.10.2026)
    secondary: false

  pravila_14:
    title: >-
      Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов
      Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых
      является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно
      через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции
      с наличной иностранной валютой
    approved_by: постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14
    registration: Зарегистрировано в Министерстве юстиции Республики Казахстан 27 февраля 2020 года № 20075
    url: https://adilet.zan.kz/rus/docs/V2000020075
    status: действующий, дата последнего изменения 24.12.2024 (карточка adilet, 17.10.2026)
    secondary: false

  instrukciya_21:
    title: >-
      Инструкция по организации антитеррористической защиты расчетно-кассовых отделений банков второго уровня,
      уязвимых в террористическом отношении
    approved_by: >-
      постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка
      от 30 апреля 2024 года № 21
    registration: Зарегистрировано в Министерстве юстиции Республики Казахстан 6 мая 2024 года № 34348
    url: https://adilet.zan.kz/rus/docs/V2400034348
    status: действующий, одна редакция (карточка adilet, 17.10.2026)
    # Issued by АРРФР, not НБРК, and covers only РКО designated as terrorism-vulnerable. Cite next to a primary act.
    secondary: true

types:
  - id: workplace_left
    name: Рабочее место оставлено с незакрытыми ценностями
    rules:
      - doc: pravila_231
        punkt: п. 22
        quote: Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.
      - doc: pravila_231
        punkt: п. 20
        quote: >-
          Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте
          кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег
          (металлический шкаф, сейф, тележка, ящики стола, тумба).
    conditions:
      - п. 22 действует только до окончания обслуживания клиента, поэтому клиент виден у кассы, когда кассир уходит.
    description: >-
      Кассир покинул рабочее место до окончания обслуживания клиента, наличные остались на столе вне закрытого
      устройства.

  - id: cash_on_desk_next_client
    name: Наличные на столе при обслуживании следующего клиента
    rules:
      - doc: pravila_231
        punkt: п. 20
        quote: >-
          На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги
          хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ,
          предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).
    conditions:
      - На столе могут лежать только деньги клиента, которого обслуживают сейчас. Тип срабатывает, когда наличные
        предыдущего клиента остаются на столе после смены клиента.
    description: >-
      Наличные предыдущего клиента остались на столе вне закрытого устройства, пока кассир обслуживает следующего
      клиента.

  - id: outsider_in_cash_room
    name: Посторонний в кассовом помещении
    rules:
      - doc: pravila_14
        punkt: п. 8
        quote: >-
          Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений
          одним закрывающимся служебным входом.
      - doc: instrukciya_21
        punkt: п. 14 подп. 1)
        quote: >-
          Пропускной режим предназначен для того, чтобы исключить: 1) проникновение в расчетно-кассовое отделение
          или его части (зоны) посторонних лиц с противоправными намерениями;
      - doc: instrukciya_21
        punkt: п. 15 подп. 3), 5)
        quote: >-
          3) зонирование расчетно-кассового отделения (устанавливается не менее двух основных зон: ...);
          5) определение перечня лиц актом руководителя расчетно-кассового отделения, допускаемых в зоны
          ограниченного доступа в расчетно-кассовое отделение;
    conditions:
      - Человек находится в кассовом узле, а не в клиентской зоне перед кассой.
    description: >-
      В кассовом узле находится человек, который не работает за кассой, без сопровождения работника кассы.

  - id: count_without_controller
    name: Пересчёт наличных без контролирующего работника
    rules:
      - doc: pravila_231
        punkt: п. 42
        quote: >-
          Кассовые операции по пересчету, сортировке и упаковке наличных денег осуществляются кассовым работником
          в присутствии контролирующего работника, за исключением случаев совершения кассовых операций по приему
          и выдаче наличных денег клиенту.
    conditions:
      - П. 42 не применяется к приему и выдаче наличных клиенту, поэтому клиента у кассы нет.
      - Контролер может быть вне кадра, поэтому пишем "не виден в кадре", а не "отсутствует".
    description: >-
      Кассир пересчитывает наличные без клиента у кассы, контролирующий работник не виден в кадре.

  - id: foreign_object_at_desk
    name: Посторонние предметы на рабочем месте кассира
    rules:
      - doc: pravila_231
        punkt: п. 12
        quote: >-
          Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла
          в порядке, установленном внутренними документами банка.
      - doc: pravila_231
        punkt: п. 12
        quote: >-
          Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств
          связи, не имеющих функции фото и видео фиксации.
    conditions:
      - П. 12 разрешает средства связи без функции фото и видео. Камеру в телефоне по видео не проверить,
        поэтому ее наличие не утверждаем.
    description: >-
      На рабочем месте кассира в кассовом узле виден посторонний предмет: {object}.

  - id: collector_alone
    name: Доставка ценностей одним работником
    rules:
      - doc: pravila_231
        punkt: п. 98
        quote: >-
          Бригада работников подразделения инкассации банка, инкассаторской организации состоит из не менее трех
          человек. ... Инкассатор-сборщик осуществляет прием и сдачу сумок клиентов, старший бригады обеспечивает
          его безопасность при переносе, транспортировке от автомобильного транспорта до клиента и обратно.
    conditions:
      - Второй работник бригады может быть вне кадра, поэтому пишем "не виден в кадре".
    description: >-
      Инкассатор переносит сумку с ценностями, второй инкассатор не виден в кадре.

  - id: id_not_presented
    name: Выдача наличных без предъявления документа, удостоверяющего личность
    rules:
      - doc: pravila_231
        punkt: п. 31 подп. 1)
        quote: >-
          Кассовый работник банка осуществляет следующие действия: 1) проводит визуальную идентификацию клиента
          по данным документа, удостоверяющего личность, либо данным, подтверждающим (идентифицирующим) личность
          клиента, полученным посредством сервиса цифровых документов;
    conditions:
      - П. 31 описывает выдачу наличных денег клиенту, поэтому тип требует клиента у кассы и наличные на столе.
      - Подп. 1) допускает идентификацию через сервис цифровых документов, по видео ее не проверить. Пишем
        "документ в кадре не виден", а не "идентификация не проведена".
      - Документ небольшой и может быть закрыт руками или стойкой, поэтому признак косвенный.
    description: >-
      Кассир выдает наличные клиенту, документ, удостоверяющий личность, в кадре не виден.

  - id: other
    name: Иное подозрительное действие
    # No exact пункт: the reference is the act as a whole (FAQ 31).
    fallback: true
    rules:
      - doc: pravila_231
    conditions: []
    description: >-
      Действие отличается от обычной работы кассы. Нужна проверка человеком.
